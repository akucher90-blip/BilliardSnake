name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o BilliardSnake-Android.zip -d project

      - name: Fix Java and Kotlin JVM targets
        working-directory: project
        run: |
          find . -name "build.gradle" -type f -exec sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' {} \;

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardSnake-APK
          path: project/**/build/outputs/apk/debug/*.apk
```
