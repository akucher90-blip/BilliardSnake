name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o BilliardSnake-Android.zip -d project

      - name: Fix JVM targets
        working-directory: project
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | xargs -0 sed -i \
            -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' \
            -e "s/jvmTarget *= *['\"]1.8['\"]/jvmTarget = '17'/g" \
            -e "s/jvmTarget *= *['\"]8['\"]/jvmTarget = '17'/g'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardSnake-APK
          path: project/**/build/outputs/apk/debug/*.apk
```
