name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -o BilliardSnake-Android.zip -d project

      -       - name: Fix JVM target compatibility
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          if p.exists():
              s = p.read_text()

              if "compileOptions" not in s:
                  s += """
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

              if "kotlinOptions" not in s:
                  s += """
          
          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

              p.write_text(s)
              print("JVM settings added to app/build.gradle")
          else:
              print("app/build.gradle not found")
              raise SystemExit(1)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardSnake-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
