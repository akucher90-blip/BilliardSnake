name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o BilliardSnake-Android.zip -d project

      - name: Find Android project
        working-directory: project
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Fix JVM target
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("build.gradle")) + list(Path(".").rglob("build.gradle.kts"))

          if not files:
              print("ERROR: No Gradle build files found")
              raise SystemExit(1)

          print("Gradle files found:")
          for f in files:
              print(" -", f)

          for p in files:
              s = p.read_text()

              # Java 17
              if "compileOptions" not in s and "com.android.application" in s:
                  if p.suffix == ".kts":
                      s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
                  else:
                      s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

              # Kotlin JVM 17
              if "kotlinOptions" not in s and "com.android.application" in s:
                  if p.suffix == ".kts":
                      s += """

          android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
                  else:
                      s += """

          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

              p.write_text(s)

          print("JVM target configuration completed.")
          PY

      - name: Find Gradle wrapper or use Gradle
        working-directory: project
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardSnake-APK
          path: project/**/build/outputs/apk/debug/*.apk
```
