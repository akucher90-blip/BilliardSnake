name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: unzip -o BilliardSnake-Android.zip -d project

      - run: gradle -p project assembleDebug
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.*/x64

      - uses: actions/upload-artifact@v4
        with:
          name: BilliardSnake-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
